<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계산 노트</title>
    <style>
:root {
    color-scheme: light;
    font-family: "Atkinson Hyperlegible Next", "Malgun Gothic", system-ui, sans-serif;
    color: #172435;
    background: #eef1ef;
}

* { box-sizing: border-box; }
body { margin: 0; }

.workspace {
    display: grid;
    grid-template-columns: minmax(0, 360px) minmax(0, 300px);
    gap: 16px;
    width: min(100% - 32px, 676px);
    margin: clamp(22px, 7vh, 78px) auto;
    align-items: start;
}

.calculator, .history {
    min-width: 0;
    border: 1px solid #d4dcd8;
    border-radius: 18px;
    background: #fff;
    padding: 20px;
}

h1, h2 { margin: 0 0 14px; }
h1 { font-size: 1.55rem; }
h2 { font-size: 1.05rem; }

.display {
    display: grid;
    border-radius: 12px;
    padding: 14px 16px;
    background: #193330;
    color: #f7fff8;
}

.display label { color: #c7ded5; font-size: 0.8rem; }
.display input, .display output {
    min-width: 0;
    width: 100%;
    padding: 3px 0;
    border: 0;
    background: transparent;
    color: inherit;
    font-family: ui-monospace, monospace;
    text-align: right;
}

.display input { font-size: 1rem; }
.display input::placeholder { color: #bdcfc8; }
.display output { min-height: 1.4em; overflow-wrap: anywhere; font-size: 1.85rem; font-weight: 700; }
.message { min-height: 1.45em; margin: 5px 0; color: #a1262b; font-size: 0.84rem; }

.keypad { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; }
button { font: inherit; cursor: pointer; }
.keypad button {
    min-height: 45px;
    border: 1px solid #e2e8e5;
    border-radius: 8px;
    background: #f6f8f7;
    color: inherit;
    font-weight: 650;
}

.keypad .edit { background: #edf1f0; }
.keypad .operator { background: #dcf0e6; color: #163c31; }
.keypad .equals { background: #215e4a; color: #fff; }
.keypad button:hover, .history button:hover { box-shadow: inset 0 0 0 2px #538978; }
:focus-visible { outline: 2px solid #39766a; outline-offset: 2px; }
.display input:focus-visible { outline-color: #b7ead7; }

.history p { margin: 0; color: #4f5f66; font-size: 0.9rem; }
.history ol { list-style: none; padding: 0; margin: 0; }
.history li + li { margin-top: 7px; }
.history button {
    width: 100%;
    border: 1px solid #e0e8e3;
    border-radius: 8px;
    padding: 9px 10px;
    background: #f6f8f7;
    color: inherit;
    text-align: left;
    overflow-wrap: anywhere;
}

@media (max-width: 610px) {
    .workspace { grid-template-columns: minmax(0, 390px); justify-content: center; }
}
    </style>
</head>
<body>
    <main class="workspace">
        <section class="calculator" aria-labelledby="page-title">
            <h1 id="page-title">계산 노트</h1>
            <form id="note-calculator">
                <div class="display">
                    <label for="expression">수식</label>
                    <input id="expression" name="expression" type="text" maxlength="160" placeholder="(12 + 8) ÷ 4"
                        autocomplete="off" spellcheck="false" aria-describedby="message">
                    <output id="result" for="expression" aria-label="계산 결과">0</output>
                </div>
                <p id="message" class="message" role="status"></p>
                <div class="keypad">
                    <button type="reset" class="edit" aria-label="AC 초기화">AC</button>
                    <button type="button" class="edit" data-key="(">(</button>
                    <button type="button" class="edit" data-key=")">)</button>
                    <button type="button" class="edit" data-action="backspace" aria-label="한 글자 지우기">⌫</button>
                    <button type="button" data-key="7">7</button>
                    <button type="button" data-key="8">8</button>
                    <button type="button" data-key="9">9</button>
                    <button type="button" class="operator" data-key="÷" aria-label="나누기">÷</button>
                    <button type="button" data-key="4">4</button>
                    <button type="button" data-key="5">5</button>
                    <button type="button" data-key="6">6</button>
                    <button type="button" class="operator" data-key="×" aria-label="곱하기">×</button>
                    <button type="button" data-key="1">1</button>
                    <button type="button" data-key="2">2</button>
                    <button type="button" data-key="3">3</button>
                    <button type="button" class="operator" data-key="−" aria-label="빼기">−</button>
                    <button type="button" data-key="0">0</button>
                    <button type="button" data-key=".">.</button>
                    <button type="submit" class="equals" aria-label="= 계산">=</button>
                    <button type="button" class="operator" data-key="+" aria-label="더하기">+</button>
                </div>
            </form>
        </section>

        <aside class="history" aria-labelledby="history-title">
            <h2 id="history-title">계산 기록</h2>
            <p id="empty-history">계산하면 이곳에 기록됩니다.</p>
            <ol id="history"></ol>
        </aside>
    </main>
    <script>
(() => {
    'use strict';

    function calculateExpression(expression) {
        const source = expression.replaceAll('×', '*').replaceAll('÷', '/').replaceAll('−', '-').trim();
        if (!source) throw new Error('수식을 입력하세요.');
        if (source.length > 160) throw new Error('수식은 160자까지 입력할 수 있습니다.');

        let position = 0;

        function peek() {
            while (/\s/.test(source[position] ?? '')) position += 1;
            return source[position];
        }

        function readFactor() {
            const token = peek();

            // 부호와 괄호를 먼저 처리합니다.
            if (token === '+' || token === '-') {
                position += 1;
                const value = readFactor();
                return token === '-' ? -value : value;
            }

            if (token === '(') {
                position += 1;
                const value = readSum();
                if (peek() !== ')') throw new Error('닫는 괄호가 필요합니다.');
                position += 1;
                return value;
            }

            const number = source.slice(position).match(/^(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?/i);
            if (!number) throw new Error('숫자와 연산자의 순서를 확인하세요.');
            position += number[0].length;
            return finite(Number(number[0]));
        }

        function finite(value) {
            if (!Number.isFinite(value)) throw new Error('계산할 수 있는 숫자 범위를 벗어났습니다.');
            return value;
        }

        function readProduct() {
            let value = readFactor();
            let operator = peek();

            while (operator === '*' || operator === '/') {
                position += 1;
                const right = readFactor();
                if (operator === '/' && right === 0) throw new Error('0으로 나눌 수 없습니다.');
                value = finite(operator === '*' ? value * right : value / right);
                operator = peek();
            }

            return value;
        }

        function readSum() {
            let value = readProduct();
            let operator = peek();

            while (operator === '+' || operator === '-') {
                position += 1;
                const right = readProduct();
                value = finite(operator === '+' ? value + right : value - right);
                operator = peek();
            }

            return value;
        }

        const value = readSum();
        if (peek() !== undefined) throw new Error('괄호와 연산자의 위치를 확인하세요.');
        // 정수는 그대로 두고, 소수 표시에서 부동소수점 오차를 줄입니다.
        return String(Number.isInteger(value) ? value : Number(value.toPrecision(15)));
    }

    window.calculateExpression = calculateExpression;
})();

(() => {
    'use strict';

    const form = document.querySelector('#note-calculator');
    const expression = document.querySelector('#expression');
    const result = document.querySelector('#result');
    const message = document.querySelector('#message');
    const history = document.querySelector('#history');
    const emptyHistory = document.querySelector('#empty-history');

    function clearResult() {
        result.value = '0';
        message.textContent = '';
    }

    function addHistory(source, value) {
        const item = document.createElement('li');
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = `${source} = ${value}`;
        button.addEventListener('click', () => {
            expression.value = source;
            result.value = value;
            message.textContent = '';
            expression.focus();
        });
        item.append(button);
        history.prepend(item);
        if (history.children.length > 8) history.lastElementChild.remove();
        emptyHistory.hidden = true;
    }

    form.addEventListener('submit', (event) => {
        event.preventDefault();
        const source = expression.value.trim();

        try {
            const value = window.calculateExpression(source);
            result.value = value;
            message.textContent = '';
            addHistory(source, value);
        } catch (problem) {
            result.value = '—';
            message.textContent = problem.message;
        }
    });

    form.addEventListener('reset', clearResult);
    expression.addEventListener('input', clearResult);
    expression.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') form.reset();
    });

    form.querySelector('.keypad').addEventListener('click', (event) => {
        const key = event.target.closest('button');
        if (!key || key.type !== 'button') return;

        const start = expression.selectionStart;
        const end = expression.selectionEnd;
        if (key.dataset.action === 'backspace') {
            const deleteFrom = start === end ? Math.max(0, start - 1) : start;
            expression.setRangeText('', deleteFrom, end, 'end');
        } else if (expression.value.length - (end - start) < expression.maxLength) {
            expression.setRangeText(key.dataset.key, start, end, 'end');
        }

        clearResult();
    });
})();
    </script>
</body>
</html>
