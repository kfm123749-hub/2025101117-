function meas(s,size,weight,ls=-0.02){ctx.save();ctx.font=`${weight} ${size}px Pretendard`;ctx.letterSpacing=(ls*size)+'px';const w=ctx.measureText(s).width;ctx.restore();return w;}
function txt(s,x,y,size,weight,color,align='left',alpha=1,ls=-0.02,maxW=960){

  ctx.save();ctx.globalAlpha*=alpha;ctx.font=`${weight} ${size}px Pretendard`;ctx.letterSpacing=(ls*size)+'px';

function rich(parts,x,y,alpha=1,align='center',maxW=920){

/* ---------- 공통 UI ---------- */
function progress(t){ctx.fillStyle='rgba(255,255,255,.08)';rr(80,136,920,6,3);ctx.fill();
  const g=ctx.createLinearGradient(80,0,1000,0);g.addColorStop(0,BLUE);g.addColorStop(.5,VIO);g.addColorStop(1,GOLD);ctx.fillStyle=g;rr(80,136,920*Math.min(1,t/DUR),6,3);ctx.fill();}
function chip(t,tin,tout,s,col){const a=io(t,tin,tout);if(a<=0)return;const w=meas(s,30,700,0)+56;
  ctx.save();ctx.globalAlpha=a;ctx.fillStyle='rgba(255,255,255,.08)';rr(80,196,w,62,31);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();

function head(t,tin,tout,l1,l2){const a=io(t,tin,tout);if(a<=0)return;const d=(1-E.out(seg(t,tin,tin+.55)))*30;
  ctx.save();ctx.shadowColor='rgba(0,0,0,.9)';ctx.shadowBlur=24;rich(l1,80,352+d,a,'left');if(l2)rich(l2,80,436+d,a,'left');ctx.restore();}
function caption(t,tin,tout,parts,sub,y=1500){const a=io(t,tin,tout,.45,.3);if(a<=0)return;const d=(1-E.out(seg(t,tin,tin+.45)))*20;
  ctx.save();ctx.shadowColor='rgba(0,0,0,.95)';ctx.shadowBlur=26;rich(parts,540,y+d,a,'center',800);if(sub)txt(sub,540,y+54+d,29,550,'#c7c7cc','center',a,-.01,800);ctx.restore();}
const sceneA=(t,a,b)=>io(t,a,b-.45,.45,.35);

/* ---------- 배경 ---------- */
const DUST=[...Array(140)].map(()=>({x:rnd()*W,y:rnd()*HH,r:.5+rnd()*1.4,p:rnd()*6.28,v:.2+rnd()*.6}));

}

/* =========================================================
   0. 훅 — 픽셀 얼굴 (창작 그림, 실제 AI 출력 아님)
   ========================================================= */
function drawFace(g){
  const S=512;let gr=g.createRadialGradient(256,190,40,256,256,380);gr.addColorStop(0,'#6b8fbf');gr.addColorStop(1,'#16223a');g.fillStyle=gr;g.fillRect(0,0,S,S);

  g.beginPath();g.moveTo(30,512);g.bezierCurveTo(50,430,150,405,200,398);g.lineTo(312,398);g.bezierCurveTo(362,405,462,430,482,512);g.closePath();g.fill();
  // 목
  gr=g.createLinearGradient(0,330,0,420);gr.addColorStop(0,'#b97d5c');gr.addColorStop(1,'#d79b78');g.fillStyle=gr;
  g.beginPath();g.moveTo(212,320);g.lineTo(300,320);g.lineTo(306,410);g.quadraticCurveTo(256,432,206,410);g.closePath();g.fill();

  g.fillStyle='#2a1c16';g.beginPath();g.ellipse(256,226,150,170,0,0,6.283);g.fill();
  g.beginPath();g.moveTo(112,240);g.quadraticCurveTo(100,330,135,372);g.lineTo(170,300);g.closePath();g.fill();
  g.beginPath();g.moveTo(400,240);g.quadraticCurveTo(412,330,377,372);g.lineTo(342,300);g.closePath();g.fill();
  // 귀
  g.fillStyle='#e0a984';g.beginPath();g.ellipse(146,252,16,28,-.1,0,6.283);g.fill();g.beginPath();g.ellipse(366,252,16,28,.1,0,6.283);g.fill();
  // 얼굴
  gr=g.createRadialGradient(236,215,20,256,250,170);gr.addColorStop(0,'#f8d2b2');gr.addColorStop(.7,'#e9b38f');gr.addColorStop(1,'#c98d6a');g.fillStyle=gr;
  g.beginPath();g.moveTo(256,96);g.bezierCurveTo(338,96,372,170,370,240);g.bezierCurveTo(368,312,318,368,256,372);g.bezierCurveTo(194,368,144,312,142,240);g.bezierCurveTo(140,170,174,96,256,96);g.fill();
  // 볼

  g.fillStyle='#2f2019';g.beginPath();g.moveTo(140,236);g.bezierCurveTo(128,120,214,78,280,86);g.bezierCurveTo(352,94,392,152,374,238);

  g.strokeStyle='rgba(120,80,60,.45)';g.lineWidth=3;g.beginPath();g.moveTo(286,92);g.quadraticCurveTo(250,120,236,160);g.stroke();

    g.fillStyle='#fff';g.beginPath();g.arc(x+4,232,3,0,6.283);g.fill();
    g.strokeStyle='#2a1a12';g.lineWidth=3.5;g.beginPath();g.moveTo(x-27,236);g.quadraticCurveTo(x,216,x+27,235);g.stroke();

  g.fillStyle='#d97a70';g.beginPath();g.moveTo(224,329);g.quadraticCurveTo(256,352,288,329);g.quadraticCurveTo(256,336,224,329);g.fill();

function noiseCanvas(k,colored,n=64){const c=document.createElement('canvas');c.width=c.height=n;const g=c.getContext('2d'),im=g.createImageData(n,n);let s=k*7919+13;const r=()=>(s=(s*16807)%2147483647)/2147483647;
  for(let i=0;i<im.data.length;i+=4){const v=r()*255;im.data[i]=colored?r()*255:v;im.data[i+1]=colored?r()*255:v;im.data[i+2]=colored?r()*255:v;im.data[i+3]=255;}g.putImageData(im,0,0);return c;}
const NOISE=[...Array(6)].map((_,k)=>noiseCanvas(k,false)),CNOISE=[...Array(6)].map((_,k)=>noiseCanvas(k+20,true,48));
function hook(t,AM=1){
  const A=(1-E.in(seg(t,4.2,4.55)))*AM;if(A<=0)return;
  const X=220,Y=540,SZ=640,n=TL.faceN(t),p=seg(t,1.75,2.95);

  ctx.save();rr(X,Y,SZ,SZ,34);ctx.clip();

  const yr=2014+Math.floor(4*p+1e-6);
  txt(String(yr),540,1300,120,850,p>=1?GOLD:'#cfd6e4','center',A,-.03);
  txt('Illustration, not real AI output',540,1360,26,600,'#8e8e93','center',A,0);
  ctx.save();ctx.shadowColor='rgba(0,0,0,.9)';ctx.shadowBlur=24;
  rich([["AI's attempt at a ",60,800,INK],['human face',62,850,GOLD]],80,352,A,'left');
  rich([['Back in 2014…',58,750,'#c7c7cc']],80,436,A*(1-E.in(seg(t,1.45,1.7))),'left');
  rich([['Four years later: ',58,750,INK],['this',62,850,GOLD]],80,436+(1-E.out(seg(t,1.75,2.2)))*20,A*E.out(seg(t,1.75,2.2)),'left');
  ctx.restore();
}

/* =========================================================
   1. 커지는 AI — 원의 면적 = 매개변수 수
   ========================================================= */
const DISK=[...Array(700)].map(()=>{let x,y;do{x=rnd()*2-1;y=rnd()*2-1;}while(x*x+y*y>1);return [x,y,rnd()];});
const CIRC=[['GPT-3',330,GOLD,'255,200,61',9.0],['GPT-2',30.6,VIO,'191,140,255',6.2],['GPT-1',8.53,BLUE,'90,200,250',4.65]];
function scaleScene(t){
  if(t<S.scale-.05||t>S.chat+.05)return;const A=sceneA(t,S.scale,S.chat);if(A<=0)return;
  const z=TL.zoom(t),AX=540,AY=1290;
  for(const [nm,r,col,rgb,tin] of CIRC){
    const R=r*z,cx=AX,cy=AY-R,a=A*E.out(seg(t,tin,tin+.7));if(a<=0||R>2600)continue;
    ctx.save();ctx.globalAlpha=a;
    const g=ctx.createRadialGradient(cx,cy,R*.15,cx,cy,R);g.addColorStop(0,`rgba(${rgb},.04)`);g.addColorStop(1,`rgba(${rgb},.24)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R,0,6.283);ctx.fill();
    if(R>40){ctx.fillStyle=`rgb(${rgb})`;const k=Math.min(700,Math.floor(R*1.7));for(let i=0;i<k;i++){const [u,v,w]=DISK[i],px=cx+u*R*.95,py=cy+v*R*.95;if(py<-10||py>HH+10)continue;
      ctx.globalAlpha=a*(.18+.45*w*(.6+.4*Math.sin(t*2.3+i)));ctx.beginPath();ctx.arc(px,py,1.4+1.3*w,0,6.283);ctx.fill();}}
    ctx.globalAlpha=a;ctx.strokeStyle=col;ctx.lineWidth=3.5;ctx.shadowColor=col;ctx.shadowBlur=18;ctx.beginPath();ctx.arc(cx,cy,R,0,6.283);ctx.stroke();ctx.restore();
    // 이름표: 큰 원은 위에, 작은 원은 오른쪽에 (전환 구간에서는 잠깐 사라짐)
    const big=R>=72,fade=Math.min(1,Math.abs(R-72)/14);
    if(big){const y=cy-R-24;if(y>500)txt(nm,cx,y,40,850,col,'center',a*fade,-.02);}
    else{const ly=nm==='GPT-2'?AY-2*R-8:AY+2,lx=650;
      ctx.save();ctx.globalAlpha=a*fade;ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx+R*.75,cy-R*.65);ctx.lineTo(lx-14,ly-10);ctx.stroke();ctx.restore();
      txt(nm,lx,ly,32,800,col,'left',a*fade,-.01);}
  }
  const bp=seg(t,10.6,11.0);if(bp>0){ctx.save();ctx.translate(540,1010);const sc=E.back(bp);ctx.scale(sc,sc);ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=30;
    const g=ctx.createLinearGradient(-260,0,260,0);g.addColorStop(0,'#fff3c4');g.addColorStop(.5,GOLD);g.addColorStop(1,'#ff9a3c');
    ctx.globalAlpha=A;ctx.font='850 150px Pretendard';ctx.letterSpacing='-5px';ctx.textAlign='center';ctx.fillStyle=g;ctx.fillText('×1,500',0,0);ctx.restore();}
}

/* =========================================================
   2. ChatGPT — 1억 명까지 걸린 시간
   ========================================================= */
const RACE=[['ChatGPT',2,GREEN,'2 months'],['TikTok',9,PINK,'9 months'],['Instagram',30,VIO,'2.5 years']];
function person(x,y,s,col,a){ctx.save();ctx.globalAlpha=a;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y-14*s,11*s,0,6.283);ctx.fill();rr(x-15*s,y,30*s,26*s,13*s);ctx.fill();ctx.restore();}

    RACE.forEach(([nm,tg,col,lab],i)=>{const y=620+i*190,p=Math.min(1,m/tg),ft=TL.finish(tg),done=t>=ft,ap=rA*E.out(seg(t,12.75+i*.12,13.25+i*.12));

      if(done)txt(lab,910,y+66,32,850,'#0b0d12','right',ap*E.out(seg(t,ft,ft+.25)),-.01);
      if(done)txt('Hit 100M',910,y,28,700,col,'right',ap*E.out(seg(t,ft,ft+.25)),0);});
    txt('Time elapsed',110,1236,30,650,SUB,'left',rA*E.out(seg(t,13.2,13.6)),0);
    const mm=Math.floor(m+1e-6);rich([[String(mm),96,850,INK],[mm===1?' month':' months',44,750,SUB]],110,1336,rA*E.out(seg(t,13.2,13.6)),'left');
  }
  const bA=A*E.out(seg(t,17.7,18.2));

    txt('Weekly ChatGPT users, February 2026',540,700,38,700,'#c7c7cc','center',bA,-.01);
    const v=900*E.expo(seg(t,17.8,19.0));
    ctx.save();ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=30;const g=ctx.createLinearGradient(240,0,840,0);g.addColorStop(0,'#fff3c4');g.addColorStop(.5,GOLD);g.addColorStop(1,'#ff9a3c');
    ctx.globalAlpha=bA;ctx.font='850 200px Pretendard';ctx.letterSpacing='-6px';ctx.textAlign='center';ctx.fillStyle=g;ctx.fillText(Math.round(v)+'M',540,930);ctx.restore();
    const pa=bA*E.out(seg(t,19.2,19.6));

/* =========================================================

const PX=110,PY=600,PW=860,PH=580;
const SCN=document.createElement('canvas');SCN.width=PW;SCN.height=PH;const sg=SCN.getContext('2d');
function drawSea(g,tt,warp){
