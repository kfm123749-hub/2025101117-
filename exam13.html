<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>JS 조건문</h1>
<script>
    let number = prompt('정수를 입력하세요');
    if( number % 2 == 0 ) {
        alert('짝수 입니다.');
        document.write(number + '은(는) 짝수 입니다.');
    }
    else {
        alert('홀수 입니다.');
        document.write(number + '은(는) 홀수 입니다.');
    }
</script>
</body>
</html>
