<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>우연과 법칙</title>
<style>
@font-face{font-family:"Pretendard";font-weight:45 920;font-style:normal;
  src:url("node_modules/pretendard/dist/web/variable/woff2/PretendardVariable.woff2") format("woff2-variations");}
*{margin:0;padding:0}html,body{background:#000;overflow:hidden}canvas{display:block;width:1080px;height:1920px}
</style>
<script src="sim.js"></script>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* 20초 모션그래픽 — 공 하나는 우연, 천 개는 법칙 (갈턴 보드) */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=1080,HH=1920,DUR=20,S=GALTON;
const cl=x=>Math.min(1,Math.max(0,x)),lerp=(a,b,s)=>a+(b-a)*s,seg=(t,a,b)=>cl((t-a)/(b-a));
const E={out:x=>1-Math.pow(1-x,3),in:x=>x*x*x,io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  back:x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}};
const io=(t,a,b,din=.5,dout=.35)=>E.out(seg(t,a,a+din))*(1-E.in(seg(t,b,b+dout)));
const INK='#f5f5f7',SUB='#a1a1a6',GOLD='#ffc83d',BLUE='#5ac8fa',VIO='#bf8cff',MINT='#64e3c0';
function txt(s,x,y,size,weight,color,align='left',alpha=1,ls=-0.02){
  if(alpha<=0.003)return 0;ctx.save();ctx.globalAlpha*=alpha;ctx.font=`${weight} ${size}px Pretendard`;ctx.letterSpacing=(ls*size)+'px';
  ctx.textAlign=align;ctx.fillStyle=color;ctx.fillText(s,x,y);const w=ctx.measureText(s).width;ctx.restore();return w;}
function meas(s,size,weight,ls=-0.02){ctx.save();ctx.font=`${weight} ${size}px Pretendard`;ctx.letterSpacing=(ls*size)+'px';const w=ctx.measureText(s).width;ctx.restore();return w;}
function rich(parts,x,y,alpha=1,align='center'){const ws=parts.map(p=>meas(p[0],p[1],p[2]));let cx=align==='center'?x-ws.reduce((a,b)=>a+b,0)/2:x;
  parts.forEach((p,i)=>{txt(p[0],cx,y,p[1],p[2],p[3],'left',alpha);cx+=ws[i];});}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}

const {R,N,CX,DX,Y0,DY,BIN_BOTTOM,BALL,G,balls,counts}=S;
const BIN_TOP=Y0+(R-1)*DY+40;
/* 칸 위치에 따른 색: 가운데 금색 → 바깥 파랑·보라 */
const binCol=k=>{const d=Math.abs(k-6)/6;const a=[255,200,61],b=[90,200,250],c=[191,140,255];
  const m=d<.5?a.map((v,i)=>lerp(v,b[i],d/.5)):b.map((v,i)=>lerp(v,c[i],(d-.5)/.5));return `rgb(${m.map(Math.round).join(',')})`;};
const BINC=[...Array(R+1)].map((_,k)=>binCol(k));

/* 공의 위치 */
function pos(b,t){
  if(t<b.rel)return null;
  const yTop=Y0-120;
  if(t<b.rel+b.drop){const s=(t-b.rel)/b.drop;return [CX+b.jit*(1-s),lerp(yTop,Y0-BALL-3,s*s),0];}
  const tr=t-b.rel-b.drop,r=Math.floor(tr/b.step);
  if(r<R){
    const s=(tr-r*b.step)/b.step,k0=b.ks[r],k1=b.ks[r+1];
    const x0=CX+(k0-r/2)*DX,x1=CX+(k1-(r+1)/2)*DX;
    const y0=Y0+r*DY-BALL-3,y1=Y0+(r+1)*DY-BALL-3;
    return [lerp(x0,x1,s),lerp(y0,y1,s*s)-16*Math.sin(Math.PI*s)*(1-s*.5),1];
  }
  const xe=CX+(b.bin-R/2)*DX,ye=Y0+R*DY-BALL-3;
  if(t<b.landT){const s=(t-b.exitT)/b.fallT;return [lerp(xe,b.fx,s),lerp(ye,b.fy,s*s),1];}
  return [b.fx,b.fy,2];
}
/* 핀 */
const PEGS=[];for(let r=0;r<R;r++)for(let j=0;j<=r;j++)PEGS.push([CX+(j-r/2)*DX,Y0+r*DY,r,j]);

function bg(t){
  ctx.fillStyle='#05060b';ctx.fillRect(0,0,W,HH);
  let g=ctx.createRadialGradient(540,1300,0,540,1300,900);g.addColorStop(0,'rgba(255,190,70,'+(0.05+0.09*seg(t,10,15)).toFixed(3)+')');g.addColorStop(.6,'rgba(255,190,70,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,HH);
  g=ctx.createRadialGradient(160,140,0,160,140,900);g.addColorStop(0,'rgba(90,140,255,.14)');g.addColorStop(.6,'rgba(90,140,255,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,HH);
}
function board(t){
  const a=E.out(seg(t,0,.5));
  // 칸 칸막이
  ctx.strokeStyle=`rgba(255,255,255,${(.13*a).toFixed(3)})`;ctx.lineWidth=2;
  for(let k=0;k<=R+1;k++){const x=CX+(k-.5-R/2)*DX;ctx.beginPath();ctx.moveTo(x,BIN_TOP);ctx.lineTo(x,BIN_BOTTOM);ctx.stroke();}
  ctx.strokeStyle=`rgba(255,255,255,${(.35*a).toFixed(3)})`;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(CX-(R/2+.5)*DX,BIN_BOTTOM+1);ctx.lineTo(CX+(R/2+.5)*DX,BIN_BOTTOM+1);ctx.stroke();
  // 핀 + 부딪힌 순간의 빛
  const flash=new Float32Array(PEGS.length);
  for(const b of balls){
    if(t<b.rel+b.drop||t>b.exitT+.15)continue;
    const tr=t-b.rel-b.drop,r=Math.min(R-1,Math.floor(tr/b.step));
    for(let rr2=Math.max(0,r-1);rr2<=r;rr2++){const dt=t-b.hits[rr2];if(dt>=0&&dt<.22){const idx=rr2*(rr2+1)/2+b.ks[rr2];flash[idx]=Math.max(flash[idx],1-dt/.22);}}
  }
  ctx.globalCompositeOperation='lighter';
  PEGS.forEach(([x,y],i)=>{const f=flash[i];if(f>0){const g=ctx.createRadialGradient(x,y,0,x,y,26);g.addColorStop(0,`rgba(255,220,140,${(.55*f).toFixed(3)})`);g.addColorStop(1,'rgba(255,220,140,0)');ctx.fillStyle=g;ctx.fillRect(x-26,y-26,52,52);}});
  ctx.globalCompositeOperation='source-over';
  PEGS.forEach(([x,y,r],i)=>{const ap=a*E.out(seg(t,.05+r*.03,.35+r*.03));ctx.fillStyle=flash[i]>0?`rgba(255,${Math.round(lerp(255,214,flash[i]))},${Math.round(lerp(255,140,flash[i]))},${ap})`:`rgba(220,226,240,${(.75*ap).toFixed(3)})`;
    ctx.beginPath();ctx.arc(x,y,4.2+2.5*flash[i],0,6.283);ctx.fill();});
}
function ballsDraw(t){
  // 첫 공의 궤적
  const b0=balls[0],trA=1-seg(t,4.2,5.2);
  if(t>b0.rel&&trA>0){ctx.save();ctx.strokeStyle=`rgba(255,200,61,${(.75*trA).toFixed(3)})`;ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
    let first=true;for(let x=b0.rel;x<=Math.min(t,b0.landT);x+=1/120){const p=pos(b0,x);if(!p)continue;first?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]);first=false;}ctx.stroke();ctx.restore();}
  for(const b of balls){
    const p=pos(b,t);if(!p)continue;
    const big=b.i===0?lerp(2.3,1,E.io(seg(t,3.3,4.2))):1;
    ctx.fillStyle=p[2]===2?BINC[b.bin]:(b.i===0?GOLD:'#ffffff');
    if(p[2]<2&&b.i!==0)ctx.fillStyle=`rgba(255,255,255,.95)`;
    ctx.beginPath();ctx.arc(p[0],p[1],BALL*big,0,6.283);ctx.fill();
  }
  // 첫 공 강조 링
  const p0=pos(b0,t);if(p0&&t<4.3){const a=1-seg(t,3.8,4.3);ctx.strokeStyle=`rgba(255,200,61,${(.9*a).toFixed(3)})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p0[0],p0[1],BALL*2.3+10+4*Math.sin(t*9),0,6.283);ctx.stroke();}
}
/* 정규분포 곡선 */
const MU=6,SD=Math.sqrt(3),rowH=BALL*1.86,perRow=6;
const yOfCount=c=>BIN_BOTTOM-(c/perRow)*rowH;
function curve(t){
  const p=E.io(seg(t,14.0,15.6));if(p<=0)return;const a=1-.55*seg(t,16.6,17.2);
  ctx.save();ctx.beginPath();
  const x0=CX-(R/2+.5)*DX,x1=CX+(R/2+.5)*DX,xe=lerp(x0,x1,p);
  for(let x=x0;x<=xe;x+=3){const k=(x-CX)/DX+6;const c=N/(SD*Math.sqrt(2*Math.PI))*Math.exp(-((k-MU)**2)/(2*SD*SD));const y=yOfCount(c)-8;x===x0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
  ctx.shadowColor='rgba(255,255,255,.9)';ctx.shadowBlur=18;ctx.strokeStyle=`rgba(255,255,255,${a})`;ctx.lineWidth=6;ctx.lineCap='round';ctx.stroke();ctx.restore();
}
function counter(t){
  const a=io(t,3.4,16.5);if(a<=0)return;
  const n=balls.filter(b=>b.landT<=t).length;
  txt('떨어진 공',1000,232,30,650,SUB,'right',a,0);
  txt(n.toLocaleString('en-US')+'개',1000,318,78,850,n>=N?GOLD:INK,'right',a,-.03);
}
function texts(t){
  const L=(parts,y,tin,tout,align='left',x=80)=>{const a=io(t,tin,tout);if(a<=0)return;const d=(1-E.out(seg(t,tin,tin+.5)))*30;ctx.save();ctx.shadowColor='rgba(0,0,0,.85)';ctx.shadowBlur=24;rich(parts,x,y+d,a,align);ctx.restore();};
  // 훅
  L([['공 하나가 ',64,800,INK],['어디로',64,850,GOLD]],300,.1,3.2);
  L([['떨어질지는 아무도 모릅니다',64,800,INK]],386,.5,3.2);
  // 붓기
  L([['그런데 ',60,800,INK],['1,000개',60,850,BLUE],['를',60,800,INK]],300,3.5,13.7);
  L([['떨어뜨리면?',60,800,INK]],382,3.7,13.7);
  // 곡선
  L([['종 모양',64,850,GOLD],['이',64,800,INK]],300,14.0,16.5);
  L([['저절로 나타납니다',64,800,INK]],386,14.2,16.5);
  const sa=io(t,15.4,16.5);
  if(sa>0){ctx.save();ctx.globalAlpha=sa;ctx.fillStyle='rgba(10,10,16,.72)';rr(260,1600,560,96,48);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();
    rich([['가운데 칸 ',32,650,SUB],[counts[6]+'개',34,850,GOLD],['  ·  이론값 226개',32,650,SUB]],540,1660,sa);}
  // 결말
  const ea=E.out(seg(t,16.6,17.3));
  if(ea>0){ctx.fillStyle=`rgba(5,6,11,${(.62*ea).toFixed(3)})`;ctx.fillRect(0,0,W,HH);}
  const B=(parts,y,tin)=>{const i=E.out(seg(t,tin,tin+.6));if(i<=0)return;ctx.save();ctx.shadowColor='rgba(0,0,0,.9)';ctx.shadowBlur=34;ctx.translate(540,y);const sc=lerp(.9,1,E.back(i));ctx.scale(sc,sc);rich(parts,0,0,i);ctx.restore();};
  B([['공 하나는 ',96,800,INK],['우연',96,850,BLUE]],820,16.8);
  B([['천 개는 ',96,800,INK],['법칙',96,850,GOLD]],960,17.5);
  txt('갈턴 보드 · 이항분포가 정규분포에 가까워지는 모습',540,1080,30,550,SUB,'center',E.out(seg(t,18.2,18.8)),0);
}
function progress(t){ctx.fillStyle='rgba(255,255,255,.08)';rr(80,136,920,6,3);ctx.fill();
  const g=ctx.createLinearGradient(80,0,1000,0);g.addColorStop(0,BLUE);g.addColorStop(.5,VIO);g.addColorStop(1,GOLD);ctx.fillStyle=g;rr(80,136,920*t/DUR,6,3);ctx.fill();}

window.renderFrame=t=>{ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;bg(t);board(t);ballsDraw(t);curve(t);counter(t);texts(t);progress(t);};
window.ready=(async()=>{await Promise.all([550,600,650,700,800,850].map(w=>document.fonts.load(w+' 40px Pretendard','가A1%')));await document.fonts.ready;renderFrame(0);return true;})();
</script>
</body>
</html>
