<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026학년도 2학기 시간표</title>

    <style>
        /* 전체 선택자: 테두리와 안쪽 여백을 너비에 포함 */
        * {
            box-sizing: border-box;
        }

        /* 태그 선택자: 글꼴과 배경 설정 */
        body {
            margin: 0;
            background-color: #f3f6fb;
            color: #1e293b;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                         "Malgun Gothic", sans-serif;
            line-height: 1.6;
        }

        /* id 선택자: 시간표 전체 영역 */
        #timetable {
            width: 92%;
            max-width: 1100px;
            margin: 48px auto;
            padding: 32px;
            background-color: white;
            border: 1px solid #dbe3ef;
            border-radius: 20px;
            box-shadow: 0 12px 32px rgba(30, 58, 95, 0.06);
        }

        .semester {
            display: inline-block;
            margin: 0 0 10px;
            padding: 4px 12px;
            border: 1px solid #b9d3ff;
            border-radius: 6px;
            background-color: #edf4ff;
            color: #2451a1;
            font-size: 14px;
            font-weight: bold;
        }

        h1 {
            margin: 0;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.4;
        }

        /* 자식 선택자: 제목 영역 바로 아래의 문단 */
        header > p {
            margin: 8px 0 24px;
            color: #59677a;
            font-size: 16px;
        }

        .table-wrap {
            overflow-x: auto;
            border: 1px solid #cfd9e7;
            border-radius: 12px;
        }

        .table-wrap:focus-visible {
            outline: 3px solid #2451a1;
            outline-offset: 4px;
        }

        table {
            width: 100%;
            min-width: 780px;
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed;
            text-align: center;
        }

        .period-column {
            width: 66px;
        }

        /* 그룹 선택자: 표의 모든 칸에 공통 스타일 적용 */
        th, td {
            padding: 12px 10px;
            border-right: 1px solid #dbe3ef;
            border-bottom: 1px solid #dbe3ef;
            vertical-align: middle;
        }

        thead th {
            height: 52px;
            background-color: #193b69;
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        tbody th {
            height: 62px;
            background-color: #f1f5fa;
            color: #526176;
            font-size: 15px;
            font-weight: 600;
        }

        td {
            background-color: #fcfdff;
        }

        thead tr > :last-child {
            border-right: 0;
        }

        tbody tr:last-child > th,
        tbody tr:last-child > td,
        .last-period {
            border-bottom: 0;
        }

        /* 클래스 선택자: 과목별 배경색과 강조색 */
        .course {
            border-left: 4px solid;
        }

        .web {
            background-color: #e8f1ff;
            border-left-color: #3172c9;
        }

        .machine {
            background-color: #e8f5ef;
            border-left-color: #2c855b;
        }

        .thermo {
            background-color: #fff0de;
            border-left-color: #c97820;
        }

        .ai {
            background-color: #eeeafe;
            border-left-color: #7856bc;
        }

        .data {
            background-color: #e4f4f7;
            border-left-color: #228196;
        }

        .logic {
            background-color: #fde9ee;
            border-left-color: #bf4c6c;
        }

        .chapel {
            background-color: #fff7d7;
            border-left-color: #ab861d;
        }

        /* 하위 선택자: 과목명과 세부 정보의 글자 모양 */
        .course strong {
            display: block;
            margin-bottom: 8px;
            color: #1e293b;
            font-size: 16px;
            font-weight: 700;
            word-break: keep-all;
        }

        .course small {
            display: block;
            color: #46546a;
            font-size: 13px;
            font-weight: 400;
            line-height: 1.8;
            word-break: keep-all;
        }

        .chapel strong {
            margin-bottom: 4px;
        }

        /* 가상 클래스: 과목 위에 마우스를 올리면 강조 */
        .course:hover {
            box-shadow: inset 0 0 0 2px #526c91;
        }

        .mobile-note {
            display: none;
            margin: 14px 0 0;
            color: #59677a;
            font-size: 14px;
        }

        /* 작은 화면에서 여백과 제목 크기 조정 */
        @media (max-width: 640px) {
            #timetable {
                width: 94%;
                margin: 20px auto;
                padding: 20px 16px;
                border-radius: 14px;
            }

            h1 {
                font-size: 24px;
            }

            .mobile-note {
                display: block;
            }
        }
    </style>
</head>

<body>
    <main id="timetable">
        <header>
            <span class="semester">2026 · 2학기</span>
            <h1>2026학년도 2학기 시간표</h1>

        <div class="table-wrap" tabindex="0"

                                에스라관 213호
                            </small>

                    <tr>
                        <th scope="row">2</th>
                        <td></td>
                        <td></td>
                    </tr>

                    <tr>

                        <td class="course chapel">
                            <strong>채플</strong>
                            <small>
                                806 하항래<br>

                            </small>
                        </td>

                        <td></td>

                    <tr>
                        <th scope="row">4</th>
                        <td></td>

                        <td rowspan="3" class="course machine">
                            <strong>기계학습</strong>
                            <small>
                                850 최승호<br>

                            </small>
                        </td>

                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>

                    <tr>
                        <th scope="row">5</th>
                        <td></td>
                        <td></td>
                        <td></td>

                        <td rowspan="3" class="course data">
                            <strong>AI와 함께하는 데이터 분석</strong>
                            <small>
                                1335 심순이<br>
                                에스라관 213호
                            </small>
                        </td>
                    </tr>

                    <tr>
                        <th scope="row">6</th>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>

                    <tr>
                        <th scope="row">7</th>

                        <td rowspan="3" class="course logic last-period">
                            <strong>디지털 논리회로</strong>
                            <small>
                                861 김동욱<br>
                                요한관 223호
                            </small>
                        </td>

                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>

                    <tr>
                        <th scope="row">8</th>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>

                    <tr>
                        <th scope="row">9</th>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <p class="mobile-note">
            휴대폰에서는 시간표를 좌우로 움직여 보세요.
        </p>
    </main>
</body>
</html>
