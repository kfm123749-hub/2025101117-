<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>30번 60초 풀이</title>
<link rel="stylesheet" href="node_modules/katex/dist/katex.min.css">
<script src="node_modules/katex/dist/katex.min.js"></script>
<style>
@font-face{font-family:"Pretendard";font-weight:45 920;font-style:normal;
  src:url("node_modules/pretendard/dist/web/variable/woff2/PretendardVariable.woff2") format("woff2-variations");}
:root{--bg:#07080c;--ink:#f5f5f7;--sub:#a1a1a6;--blue:#5ac8fa;--violet:#bf8cff;--orange:#ff9f0a;--green:#30d158;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;background:var(--bg);overflow:hidden;
  font-family:"Pretendard",sans-serif;color:var(--ink);letter-spacing:-0.02em}
#glow1,#glow2{position:absolute;width:1700px;height:1700px;border-radius:50%;left:0;top:0}
#glow1{background:radial-gradient(circle,rgba(90,200,250,.17),rgba(90,200,250,0) 62%)}
#glow2{background:radial-gradient(circle,rgba(255,159,10,.11),rgba(255,159,10,0) 62%)}
.abs{position:absolute;left:0;top:0;opacity:0}
.katex{font-size:1em}
#prog{position:absolute;left:80px;top:136px;width:920px;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
#progFill{height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--violet),var(--orange))}
.chip{left:80px;top:196px;height:62px;padding:0 28px;border-radius:31px;display:flex;align-items:center;
  font-size:30px;font-weight:700;letter-spacing:0;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.14)}
.head{left:80px;top:286px;width:920px;font-size:68px;line-height:1.22;font-weight:750;letter-spacing:-0.035em}
.head em{font-style:normal}
.cardbox{position:absolute;left:80px;width:920px;opacity:0;border-radius:48px;
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));border:1.5px solid var(--line)}
#gw{top:490px;height:920px;overflow:hidden}
#gc{top:1118px;height:304px}
.cardbox svg{position:absolute;left:0;top:0}
.lab{position:absolute;left:0;top:0;opacity:0;font-size:34px;white-space:nowrap;font-weight:600;transform-origin:0 50%;
  text-shadow:0 0 14px #07080c,0 0 14px #07080c,0 0 6px #07080c}
#cnt{position:absolute;left:34px;top:22px;opacity:0;display:flex;align-items:flex-end;gap:22px}
#cnt .t{font-size:24px;color:var(--sub);font-weight:600;letter-spacing:0;line-height:1.3}
#cntN{font-size:118px;font-weight:850;line-height:.92;color:var(--orange);font-variant-numeric:tabular-nums;transform-origin:50% 80%}
#cntM{font-size:34px;font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:0;padding-bottom:6px}
.gt{position:absolute;font-size:27px;font-weight:650;color:var(--sub);letter-spacing:0;white-space:nowrap}
.row{left:80px;width:920px;display:flex;align-items:center;gap:22px;font-size:38px;font-weight:500}
.tag{flex:none;height:50px;padding:0 20px;border-radius:25px;display:flex;align-items:center;font-size:25px;font-weight:750;letter-spacing:0;
  background:rgba(255,255,255,.1);color:var(--ink)}
.ctr{left:80px;width:920px;text-align:center}
.small{font-size:28px;color:var(--sub);font-weight:500;letter-spacing:-0.01em}
.box{display:inline-block;padding:20px 46px;border-radius:32px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.16)}
.big22{left:0;width:1080px;text-align:center;font-size:520px;font-weight:850;line-height:1;letter-spacing:-0.06em;
  background:linear-gradient(135deg,#fff 10%,#5ac8fa 55%,#bf8cff 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hookline{left:0;width:1080px;text-align:center;font-size:78px;font-weight:750;letter-spacing:-0.04em}
.ans{left:0;width:1080px;text-align:center;font-size:440px;font-weight:850;line-height:1;letter-spacing:-0.05em;font-variant-numeric:tabular-nums;
  background:linear-gradient(135deg,#fff 5%,#ffd27a 45%,#ff9f0a 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{display:inline-flex;align-items:center;gap:18px;height:100px;padding:0 46px;border-radius:50px;font-size:46px;font-weight:750;
  background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.16)}
.pill i{font-style:normal;color:var(--sub);font-weight:500}
.cell{position:absolute;opacity:0;width:440px;height:150px;border-radius:36px;display:flex;align-items:center;justify-content:center;font-size:44px;
  background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.14)}
</style>
</head>
<body>
<div id="stage">
  <div id="glow1"></div><div id="glow2"></div>
  <div id="prog"><div id="progFill"></div></div>
  <div id="ui"></div>
  <div id="gw" class="cardbox">
    <svg id="svg" width="920" height="920"></svg>
    <div id="labs"></div>
    <div id="cnt"><div><div class="t">교점의 개수</div><div id="cntN">1</div></div><div id="cntM">m = 0.00</div></div>
  </div>
  <div id="gc" class="cardbox">
    <svg id="svg2" width="920" height="304"></svg>
    <div class="gt" style="left:34px;top:20px">$g(m)$</div>
    <div class="gt" style="left:868px;top:222px">$m$</div>
    <div class="gt" style="left:58px;top:181px">1</div><div class="gt" style="left:58px;top:121px">2</div><div class="gt" style="left:58px;top:61px">3</div>
    <div class="gt" id="ga" style="left:0;top:252px;opacity:0;color:#30d158">$a=0$</div>
    <div class="gt" id="gb" style="left:0;top:252px;opacity:0;color:#ff9f0a">$b$</div>
  </div>
</div>
<script>
/* ---------- helpers ---------- */
const DUR=60;
const C={blue:'#5ac8fa',violet:'#bf8cff',orange:'#ff9f0a',green:'#30d158',ink:'#f5f5f7',sub:'#a1a1a6',bg:'#07080c'};
const cl=x=>Math.min(1,Math.max(0,x));
const seg=(t,a,b)=>cl((t-a)/(b-a));
const lerp=(a,b,s)=>a+(b-a)*s;
const E={out:x=>1-Math.pow(1-x,3),in:x=>x*x*x,io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  expo:x=>x>=1?1:1-Math.pow(2,-10*x),back:x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}};
function kf(t,ks,ease=E.io){
  if(t<=ks[0][0])return ks[0][1];
  for(let i=1;i<ks.length;i++){ if(t<=ks[i][0]){const [a,va]=ks[i-1],[b,vb]=ks[i];return va+(vb-va)*ease((t-a)/(b-a));} }
  return ks[ks.length-1][1];
}
function mix(c1,c2,s){const p=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));const a=p(c1),b=p(c2);
  return 'rgb('+a.map((v,i)=>Math.round(lerp(v,b[i],s))).join(',')+')';}
const acts=[];const act=f=>acts.push(f);
const tex=s=>katex.renderToString(s,{throwOnError:true,
  macros:{'\\cb':'\\textcolor{5ac8fa}{#1}','\\cv':'\\textcolor{bf8cff}{#1}','\\co':'\\textcolor{ff9f0a}{#1}','\\cg':'\\textcolor{30d158}{#1}'}});
const T=s=>s.replace(/\$([^$]+)\$/g,(_,m)=>tex(m));
document.querySelectorAll('.gt').forEach(d=>d.innerHTML=T(d.innerHTML));
const ui=document.getElementById('ui');
function el(cls,html,style={}){const d=document.createElement('div');d.className='abs '+cls;d.innerHTML=T(html);Object.assign(d.style,style);ui.appendChild(d);return d;}
function vis(d,tin,tout=1e9,o={}){
  const {dy=34,din=.6,dout=.4,sc=1}=o;
  act(t=>{
    const i=E.out(seg(t,tin,tin+din)),u=E.in(seg(t,tout,tout+dout));
    d.style.opacity=(i*(1-u)).toFixed(4);
    d.style.transform=`translateY(${((1-i)*dy-u*dy*.6).toFixed(2)}px) scale(${lerp(sc,1,i).toFixed(4)})`;
  });
  return d;
}
const fadeIO=(t,a,b=1e9,d=.5)=>E.out(seg(t,a,a+d))*(1-E.in(seg(t,b,b+.4)));
const pop=(t,t0)=>{const p=seg(t,t0,t0+.55);return p<=0?0:E.back(p)};
const ringAt=(t,times)=>{for(const x of times){const p=seg(t,x,x+.9);if(p>0&&p<1)return p;}return 0;};

/* ---------- math ---------- */
const h=u=>{const a=Math.abs(u);const v=a<=1?(5*a-a*a*a)/2:Math.exp(a-1)+1;return u<0?-v:v;};   // f^{-1}
let w0=1;for(let i=0;i<60;i++)w0-=(w0*Math.exp(w0)-2)/(Math.exp(w0)*(w0+1));
const Bm=w0/2, s0=1+w0, PT=[-(Math.exp(w0)+1),-s0];           // b, 접점
function bis(fn,lo,hi,target,inc){for(let i=0;i<70;i++){const mid=(lo+hi)/2;((fn(mid)<target)===inc)?lo=mid:hi=mid;}return (lo+hi)/2;}
const rR=u=>u<=1?2.5-u*u/2-1/u:Math.exp(u-1)/u;
const rL=s=>s<=1?2.5-s*s/2+1/s:(Math.exp(s-1)+2)/s;
function inter(m){                       // 직선 y=m(x-1) 과 y=f(x) 의 교점들
  if(Math.abs(m)<1e-12)return [[0,0]];
  const k=1/m,u=bis(rR,1e-12,80,k,true),pts=[[h(u),u]];
  if(m>0&&m<=Bm+1e-12){
    const a=bis(rL,1e-12,s0,k,false),b=bis(rL,s0,80,k,true);
    pts.push([-h(a),-a],[-h(b),-b]);
  }
  return pts;
}
const count=m=>m<=0?1:(Math.abs(m-Bm)<1e-9?2:(m<Bm?3:1));

/* ---------- timeline ---------- */
const S={s1:4.6,s2:13.6,s3:19.5,s4:42,s5:52.4};
const mAt=t=>kf(t,[[21,-.6],[24,0],[24.8,0],[27.3,.1],[29.3,.115],[33.5,Bm],[35.5,Bm],[38.5,1.2],[40.3,1.2],[41.8,Bm]]);

function scene(chipTxt,color,headHtml,tin,tout){
  vis(el('chip',chipTxt,{color}),tin,tout,{dy:16});
  vis(el('head',headHtml),tin+.12,tout,{dy:40});
}
scene('1단계',C.violet,'먼저 <em style="color:#bf8cff">역함수</em>의<br>정체를 밝힌다',S.s1,S.s2-.5);
scene('2단계',C.blue,'$y=x$ 대칭으로<br><em style="color:#5ac8fa">$y=f(x)$</em> 를 그린다',S.s2,S.s3-.5);
scene('3단계',C.orange,'점 $(1,\\,0)$ 을 축으로<br>직선을 <em style="color:#ff9f0a">돌려 본다</em>',S.s3,S.s4-.5);
scene('4단계',C.green,'$b$ 는 <em style="color:#30d158">접선</em> 조건에서<br>나온다',S.s4,S.s5-.2);

/* ---------- hook ---------- */
vis(el('chip','수학 영역 (미적분) · 4점',{left:'50%',top:'480px',marginLeft:'-200px',width:'400px',justifyContent:'center'}),.15,3.85,{dy:20});
const h22=el('big22','30',{top:'560px'});
act(t=>{
  const i=E.back(seg(t,.25,1.15)),u=E.in(seg(t,3.9,4.45));
  h22.style.opacity=(E.out(seg(t,.25,.7))*(1-u)).toFixed(4);
  h22.style.transform=`scale(${(lerp(.6,1,i)*lerp(1,1.25,u)).toFixed(4)})`;
});
vis(el('hookline','식은 복잡해 보여도',{top:'1170px',color:C.sub}),1.3,3.9);
vis(el('hookline','<span style="color:#5ac8fa">그래프 한 장</span>이면 끝납니다',{top:'1280px'}),2.2,4);

/* ---------- graph: time-dependent view ---------- */
const W=920;
const V1={cx:0,hw:4.5,cy:0,hh:4.5,H:920},V2={cx:1,hw:13,cy:0,hh:4.2,H:600},V3={cx:2,hw:64,cy:0,hh:7.5,H:600},V4={cx:-1.3,hw:8.6,cy:-.25,hh:3.3,H:600};
const VK=[[19.5,V1],[21,V2],[24.8,V2],[26.8,V3],[29.3,V3],[31.8,V2],[42,V2],[43.2,V4]];
function viewAt(t){
  if(t<=VK[0][0])return VK[0][1];
  for(let i=1;i<VK.length;i++)if(t<=VK[i][0]){
    const [a,A]=VK[i-1],[b,B]=VK[i],s=E.io((t-a)/(b-a));
    return {cx:lerp(A.cx,B.cx,s),cy:lerp(A.cy,B.cy,s),hw:Math.exp(lerp(Math.log(A.hw),Math.log(B.hw),s)),
            hh:Math.exp(lerp(Math.log(A.hh),Math.log(B.hh),s)),H:lerp(A.H,B.H,s)};
  }
  return VK[VK.length-1][1];
}
let V=V1;
const X=x=>(x-(V.cx-V.hw))/(2*V.hw)*W, Y=y=>V.H-(y-(V.cy-V.hh))/(2*V.hh)*V.H;
const NS='http://www.w3.org/2000/svg';
function S_(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e;}
const svg=document.getElementById('svg'),gw=document.getElementById('gw');
const G0=S_('g',{},svg);
const dpath=pts=>pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(2)+' '+Y(p[1]).toFixed(2)).join('');
const setL=(l,p,q)=>{l.setAttribute('x1',X(p[0]));l.setAttribute('y1',Y(p[1]));l.setAttribute('x2',X(q[0]));l.setAttribute('y2',Y(q[1]));};

act(t=>{
  V=viewAt(t);
  gw.style.height=V.H.toFixed(2)+'px';svg.setAttribute('height',V.H.toFixed(2));
  const i=E.out(seg(t,S.s1-.1,S.s1+.6)),out=E.in(seg(t,S.s5-.2,S.s5+.4));
  gw.style.opacity=(i*(1-out)).toFixed(4);
  gw.style.transform=`translateY(${((1-i)*60-out*40).toFixed(2)}px)`;
});
/* grid + axes */
const grid=S_('g',{},G0);const gl=[];
for(let i=-4;i<=4;i++){if(!i)continue;gl.push([S_('line',{stroke:'#fff','stroke-opacity':.055,'stroke-width':1.5},grid),i,0],[S_('line',{stroke:'#fff','stroke-opacity':.055,'stroke-width':1.5},grid),i,1]);}
const axX=S_('line',{stroke:'#fff','stroke-opacity':.5,'stroke-width':2.5},G0),axY=S_('line',{stroke:'#fff','stroke-opacity':.5,'stroke-width':2.5},G0);
act(t=>{
  grid.setAttribute('opacity',E.out(seg(t,S.s1+.1,S.s1+1))*(1-seg(t,19.5,20.3)));
  gl.forEach(([l,i,v])=>v?setL(l,[i,-99],[i,99]):setL(l,[-99,i],[99,i]));
  const p=E.io(seg(t,S.s1+.1,S.s1+1.2));
  axX.setAttribute('x1',0);axX.setAttribute('x2',W*p);axX.setAttribute('y1',Y(0));axX.setAttribute('y2',Y(0));
  axY.setAttribute('y1',V.H);axY.setAttribute('y2',V.H-V.H*p);axY.setAttribute('x1',X(0));axY.setAttribute('x2',X(0));
});
/* y = x */
const yx=S_('line',{stroke:'#fff','stroke-width':2.5,'stroke-dasharray':'10 12',opacity:0},G0);
act(t=>{
  const p=E.io(seg(t,S.s2+.2,S.s2+1));
  setL(yx,[-4.5,-4.5],[lerp(-4.5,6,p),lerp(-4.5,6,p)]);
  yx.setAttribute('opacity',p>0?kf(t,[[17.2,.6],[18,.25],[19.5,.25],[20.5,0]]):0);
});
/* curves */
const US=[];for(let i=0;i<=600;i++)US.push(-5.6+11.2*i/600);
const mk=c=>S_('path',{fill:'none',stroke:c,'stroke-width':5.5,'stroke-linecap':'round','stroke-linejoin':'round',opacity:0},G0);
const pGhost=mk(C.violet),pMain=mk(C.violet);
act(t=>{
  const U=kf(t,[[8.4,0],[9.6,1],[11,2.4],[11.2,5.6]]);
  if(U<=0){pMain.setAttribute('opacity',0);pGhost.setAttribute('opacity',0);return;}
  const us=[-U,...US.filter(u=>Math.abs(u)<U),U];
  const s=E.io(seg(t,14.7,17.1));
  pMain.setAttribute('d',dpath(us.map(u=>{const v=h(u);return [lerp(u,v,s),lerp(v,u,s)];})));
  pMain.setAttribute('stroke',mix(C.violet,C.blue,s));
  pMain.setAttribute('opacity',1);
  pGhost.setAttribute('d',dpath(us.map(u=>[u,h(u)])));
  pGhost.setAttribute('opacity',t>14.7?kf(t,[[14.7,0],[15.1,.28],[18.6,.28],[19.6,0]]):0);
});
/* rotating line */
const ln=S_('line',{stroke:'#fff','stroke-width':3.5,'stroke-linecap':'round',opacity:0},G0);
act(t=>{
  const m=mAt(t),x0=V.cx-V.hw-1,x1=V.cx+V.hw+1;
  setL(ln,[x0,m*(x0-1)],[x1,m*(x1-1)]);
  ln.setAttribute('opacity',E.out(seg(t,20.3,21)));
});
/* dots */
function dot(color,r=11){
  const gg=S_('g',{opacity:0},svg);
  const ring=S_('circle',{r,fill:'none',stroke:color,'stroke-width':3,opacity:0},gg);
  const c=S_('circle',{r,fill:color,stroke:C.bg,'stroke-width':4},gg);
  return {set(p,scale,op,ringP=0){
    gg.setAttribute('transform',`translate(${X(p[0]).toFixed(2)},${Y(p[1]).toFixed(2)})`);gg.setAttribute('opacity',op);
    c.setAttribute('transform',`scale(${scale.toFixed(4)})`);
    if(ringP>0&&ringP<1){ring.setAttribute('r',r+48*E.out(ringP));ring.setAttribute('opacity',(1-ringP)*.9);}else ring.setAttribute('opacity',0);
  }};
}
const dP1=dot(C.violet,10),dP2=dot(C.violet,10);
const iDots=[dot(C.orange),dot(C.orange),dot(C.orange)];
const dPiv=dot(C.green,12);
act(t=>{
  const o=t>9.6?kf(t,[[13.2,1],[13.8,0]]):0;
  dP1.set([1,2],pop(t,9.6),o,ringAt(t,[9.65]));dP2.set([-1,-2],pop(t,9.6),o,ringAt(t,[9.65]));
  dPiv.set([1,0],pop(t,19.9),t>19.9?1:0,ringAt(t,[19.95,20.9]));
  const pts=inter(mAt(t));
  iDots.forEach((d,i)=>{
    if(i<pts.length)d.set(pts[i],pop(t,20.9),t>20.9?1:0,i===1?ringAt(t,[33.5,43.3,45.9]):0);
    else d.set([0,0],0,0);
  });
});
/* labels */
const labs=document.getElementById('labs');
function lab(html,color,fs){
  const d=document.createElement('div');d.className='lab';d.innerHTML=T(html);d.style.color=color||C.ink;if(fs)d.style.fontSize=fs+'px';labs.appendChild(d);
  d.put=(p,dx,dy,op)=>{d.style.opacity=op.toFixed(4);d.style.transform=`translate(${(X(p[0])+dx).toFixed(2)}px,${(Y(p[1])+dy).toFixed(2)}px)`;};
  return d;
}
const lO=lab('$\\mathrm{O}$',C.sub,30),lInv=lab('$y=f^{-1}(x)$',C.violet,36),
  lc=lab('$\\dfrac{5x-x^3}{2}$',C.violet,27),lr=lab('$e^{x-1}+1$',C.violet,33),ll=lab('$-e^{-x-1}-1$',C.violet,33),
  lp1=lab('$(1,\\,2)$',C.ink,28),lp2=lab('$(-1,\\,-2)$',C.ink,28),
  lYX=lab('$y=x$',C.sub,30),lF=lab('$y=f(x)$',C.blue,36),lPiv=lab('$(1,\\,0)$',C.green,32),lT=lab('접점',C.orange,34);
act(t=>{
  lO.put([0,0],-40,6,.9*fadeIO(t,S.s1+1,24.6));
  lInv.put([-3.9,3.6],0,-24,fadeIO(t,11.2,14.4));
  lc.put([.62,.62],0,-30,fadeIO(t,9.7,13.1));
  lr.put([1.85,2.2],0,-22,fadeIO(t,10.6,13.15));
  ll.put([-4.05,-2.75],0,-22,fadeIO(t,10.8,13.2));
  lp1.put([1,2],-118,-44,fadeIO(t,9.8,13.1));
  lp2.put([-1,-2],-176,-46,fadeIO(t,9.8,13.1));
  lYX.put([3.6,3.6],26,2,fadeIO(t,S.s2+.9,17.3));
  lF.put([2.2,1.18],36,26,fadeIO(t,17.2,42.2)*kf(t,[[24.8,1],[25.6,0],[31,0],[31.8,1]]));
  lPiv.put([1,0],14,26,fadeIO(t,20.1,42.3)*kf(t,[[24.8,1],[25.6,0],[31,0],[31.8,1]]));
  lT.put(PT,-104,-36,fadeIO(t,33.7,35.4)+fadeIO(t,42.6,S.s5));
});
/* counter */
