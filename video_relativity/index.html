<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>60초 상대성 이론</title>
<link rel="stylesheet" href="node_modules/katex/dist/katex.min.css">
<script src="node_modules/katex/dist/katex.min.js"></script>
<style>
@font-face{font-family:"Pretendard";font-weight:45 920;font-style:normal;
  src:url("node_modules/pretendard/dist/web/variable/woff2/PretendardVariable.woff2") format("woff2-variations");}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:"Pretendard",sans-serif;color:#f5f5f7}
canvas{position:absolute;left:0;top:0;width:1080px;height:1920px}
.tx{position:absolute;left:0;width:1080px;text-align:center;opacity:0;white-space:nowrap}
.katex{font-size:1em}
</style>
<script src="timeline.js"></script>
</head>
<body>
<div id="stage"><canvas id="c" width="1080" height="1920"></canvas><div id="ui"></div></div>
<script>
/* =========================================================
   60초 상대성 이론 — 쇼츠 (1080×1920, 60fps)
   GPS 훅 → 특수(빛 속도 불변 · 빛 시계 · γ 곡선) → 일반(등가 원리 · 휜 시공간 · 중력 시간 지연) → GPS 결말
   ========================================================= */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=1080,HH=1920,DUR=60,S=TL.S,LC=TL.LC,EV=TL.ev;
const cl=x=>Math.min(1,Math.max(0,x)),lerp=(a,b,s)=>a+(b-a)*s,seg=(t,a,b)=>cl((t-a)/(b-a));
const sm=(x,a,b)=>{const p=cl((x-a)/(b-a));return p*p*(3-2*p)};
const E={out:x=>1-Math.pow(1-x,3),in:x=>x*x*x,io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  back:x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},expo:x=>x>=1?1:1-Math.pow(2,-10*x)};
const io=(t,a,b,din=.5,dout=.35)=>E.out(seg(t,a,a+din))*(1-E.in(seg(t,b,b+dout)));
const INK='#f5f5f7',SUB='#a1a1a6',SR='#5ac8fa',GR='#ff9f0a',GOLD='#ffc83d',LIGHT='#fff1a8',RED='#ff5a4f',GREEN='#30d158';
function txt(s,x,y,size,weight,color,align='left',alpha=1,ls=-0.02){
  if(alpha<=0.003)return 0;ctx.save();ctx.globalAlpha*=alpha;ctx.font=`${weight} ${size}px Pretendard`;ctx.letterSpacing=(ls*size)+'px';
  ctx.textAlign=align;ctx.fillStyle=color;ctx.fillText(s,x,y);const w=ctx.measureText(s).width;ctx.restore();return w;}
function meas(s,size,weight,ls=-0.02){ctx.save();ctx.font=`${weight} ${size}px Pretendard`;ctx.letterSpacing=(ls*size)+'px';const w=ctx.measureText(s).width;ctx.restore();return w;}
function rich(parts,x,y,alpha=1,align='center'){const ws=parts.map(p=>meas(p[0],p[1],p[2]));let cx=align==='center'?x-ws.reduce((a,b)=>a+b,0)/2:align==='right'?x-ws.reduce((a,b)=>a+b,0):x;
  parts.forEach((p,i)=>{txt(p[0],cx,y,p[1],p[2],p[3],'left',alpha);cx+=ws[i];});return ws.reduce((a,b)=>a+b,0);}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function glowDot(x,y,r,col,a=1,halo=4){const g=ctx.createRadialGradient(x,y,0,x,y,r*halo);g.addColorStop(0,col.replace('A',(.75*a).toFixed(3)));g.addColorStop(.25,col.replace('A',(.3*a).toFixed(3)));g.addColorStop(1,col.replace('A','0'));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*halo,0,6.283);ctx.fill();ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.beginPath();ctx.arc(x,y,r*.55,0,6.283);ctx.fill();}
function countBefore(arr,t,after=-1){let n=0;for(const x of arr)if(x<=t&&x>after)n++;return n;}
function lastBefore(arr,t){let r=-99;for(const x of arr)if(x<=t)r=x;return r;}

/* ---------- 배경 ---------- */
let sd=1905;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
const STARS=[...Array(230)].map(()=>({x:rnd()*W,y:rnd()*HH,r:.5+rnd()*1.5,p:rnd()*6.28,f:.4+rnd()}));
const starShift=t=>t<8?0:t<13.2?260*(t-8):260*5.2;
function bg(t){
  ctx.fillStyle='#04060c';ctx.fillRect(0,0,W,HH);
  const gr=sm(t,29.6,31)*(1-sm(t,55.5,57)),cyan=1-gr;
  let g=ctx.createRadialGradient(150,170,0,150,170,980);g.addColorStop(0,`rgba(60,150,255,${(.16*cyan+.05).toFixed(3)})`);g.addColorStop(.6,'rgba(60,150,255,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,HH);
  g=ctx.createRadialGradient(950,1800,0,950,1800,950);g.addColorStop(0,`rgba(255,150,40,${(.04+.13*gr).toFixed(3)})`);g.addColorStop(.6,'rgba(255,150,40,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,HH);
  const sh=starShift(t);
  for(const s of STARS){const a=.18+.5*Math.abs(Math.sin(s.p+t*s.f)),x=((s.x-sh*s.r*.6)%W+W)%W;
    if(t>8&&t<13.2){ctx.strokeStyle=`rgba(255,255,255,${(a*.7).toFixed(3)})`;ctx.lineWidth=s.r;ctx.beginPath();ctx.moveTo(x,s.y);ctx.lineTo(x+22*s.r,s.y);ctx.stroke();}
    else{ctx.fillStyle=`rgba(255,255,255,${a.toFixed(3)})`;ctx.beginPath();ctx.arc(x,s.y,s.r,0,6.283);ctx.fill();}}
}
/* ---------- 공통 UI ---------- */
function progress(t){ctx.fillStyle='rgba(255,255,255,.08)';rr(80,136,920,6,3);ctx.fill();
  const g=ctx.createLinearGradient(80,0,1000,0);g.addColorStop(0,SR);g.addColorStop(.5,'#bf8cff');g.addColorStop(1,GR);ctx.fillStyle=g;rr(80,136,920*t/DUR,6,3);ctx.fill();}
function chip(t,tin,tout,s,col){const a=io(t,tin,tout);if(a<=0)return;const w=meas(s,30,700,0)+56;
  ctx.save();ctx.globalAlpha=a;ctx.fillStyle='rgba(255,255,255,.08)';rr(80,196,w,62,31);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();
  txt(s,108,238,30,700,col,'left',a,0);}
function head(t,tin,tout,l1,l2){const a=io(t,tin,tout);if(a<=0)return;const d=(1-E.out(seg(t,tin,tin+.55)))*30;
  ctx.save();ctx.shadowColor='rgba(0,0,0,.9)';ctx.shadowBlur=24;rich(l1,80,352+d,a,'left');if(l2)rich(l2,80,436+d,a,'left');ctx.restore();}
function caption(t,tin,tout,parts,sub,y=1528){const a=io(t,tin,tout,.45,.3);if(a<=0)return;const d=(1-E.out(seg(t,tin,tin+.45)))*20;
  ctx.save();ctx.shadowColor='rgba(0,0,0,.95)';ctx.shadowBlur=26;rich(parts,540,y+d,a);if(sub)txt(sub,540,y+56+d,29,550,'#c7c7cc','center',a,-.01);ctx.restore();}
const ui=document.getElementById('ui');
function el(html,style){const d=document.createElement('div');d.className='tx';d.innerHTML=html.replace(/\$([^$]+)\$/g,(_,m)=>katex.renderToString(m,{throwOnError:true}));Object.assign(d.style,style);ui.appendChild(d);return d;}
function domVis(d,a,dy=0,sc=1){d.style.opacity=a.toFixed(4);d.style.transform=`translateY(${dy.toFixed(1)}px) scale(${sc.toFixed(4)})`;}

/* ---------- 작은 아이콘 ---------- */
function iconLightClock(cx,cy,s,t,col,a){
  ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=col;ctx.lineWidth=5*s;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx-70*s,cy-55*s);ctx.lineTo(cx+70*s,cy-55*s);ctx.moveTo(cx-70*s,cy+55*s);ctx.lineTo(cx+70*s,cy+55*s);ctx.stroke();
  const ph=(t*1.1)%1,xs=[-60,-20,20,60];ctx.strokeStyle='rgba(255,241,168,.55)';ctx.lineWidth=2.5*s;ctx.beginPath();
  for(let i=0;i<4;i++){const x=cx+xs[i]*s,y=cy+(i%2?-50:50)*s;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();
  const k=Math.floor(ph*3),f=ph*3-k,x=cx+lerp(xs[k],xs[k+1],f)*s,y=cy+lerp(k%2?-50:50,k%2?50:-50,f)*s;ctx.restore();
  glowDot(x,y,8*s,'rgba(255,241,168,A)',a,3);
}
function iconWell(cx,cy,s,t,col,a){
  ctx.save();ctx.globalAlpha=a;
  for(let i=0;i<5;i++){const r=(110-20*i)*s,dy=(i*i*4)*s;ctx.strokeStyle=col;ctx.globalAlpha=a*(.25+.15*i);ctx.lineWidth=2.5*s;ctx.beginPath();ctx.ellipse(cx,cy-30*s+dy,r,r*.32,0,0,6.283);ctx.stroke();}
  ctx.globalAlpha=a;const g=ctx.createRadialGradient(cx,cy+40*s,0,cx,cy+40*s,26*s);g.addColorStop(0,'#fff3c4');g.addColorStop(1,col);ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy+38*s,22*s,0,6.283);ctx.fill();
  const ang=t*2.2;ctx.fillStyle='#8fd2ff';ctx.beginPath();ctx.arc(cx+86*s*Math.cos(ang),cy-6*s+28*s*Math.sin(ang),9*s,0,6.283);ctx.fill();ctx.restore();
}
function theoryCard(x,y,w,h,col,icon,year,title,sub,a,dx,t){
  if(a<=0)return;ctx.save();ctx.translate(dx,0);ctx.globalAlpha=a;
  ctx.fillStyle='rgba(14,18,30,.82)';rr(x,y,w,h,44);ctx.fill();ctx.strokeStyle=col;ctx.globalAlpha=a*.45;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=a;
  icon(x+150,y+h/2,1,t,col,a);
  if(year){const yw=meas(year,26,800,0)+36;ctx.fillStyle=col;ctx.globalAlpha=a*.18;rr(x+300,y+h/2-92,yw,44,22);ctx.fill();ctx.globalAlpha=a;txt(year,x+318,y+h/2-61,26,800,col,'left',1,0);}
  txt(title,x+300,y+h/2+(year?2:-8),50,850,col,'left',1,-.03);
  txt(sub,x+300,y+h/2+(year?56:46),32,650,INK,'left',1,-.02);ctx.restore();
}

/* =========================================================
   0. 훅 — GPS 위치가 하루 만에 11.5km 어긋남
   ========================================================= */
const MAP={x:80,y:540,w:920,h:860};
const ROADS=[];{let s2=7;const r2=()=>(s2=(s2*16807)%2147483647)/2147483647;
  for(let i=0;i<9;i++)ROADS.push({pts:[...Array(6)].map((_,k)=>[MAP.x-40+k*200+(r2()-.5)*60,MAP.y+60+i*100+(r2()-.5)*40]),w:i%3===0?7:3});
  for(let i=0;i<8;i++)ROADS.push({pts:[...Array(6)].map((_,k)=>[MAP.x+40+i*125+(r2()-.5)*50,MAP.y-40+k*190+(r2()-.5)*50]),w:i%3===1?7:3});}
const SAT=[215,805],PH=[640,1150],KMPX=20,DIRX=(PH[0]-SAT[0]),DIRY=(PH[1]-SAT[1]),R0=Math.hypot(DIRX,DIRY),UX=DIRX/R0,UY=DIRY/R0,TH=Math.atan2(DIRY,DIRX);
function drawSat(x,y,s,a){ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);ctx.rotate(-.5);ctx.fillStyle='#4d7bd6';ctx.fillRect(-46*s,-9*s,28*s,18*s);ctx.fillRect(18*s,-9*s,28*s,18*s);
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1;ctx.strokeRect(-46*s,-9*s,28*s,18*s);ctx.strokeRect(18*s,-9*s,28*s,18*s);ctx.fillStyle='#e9eef6';ctx.fillRect(-15*s,-13*s,30*s,26*s);ctx.restore();}
function hook(t){
  const A=1-E.in(seg(t,4.15,4.65));if(A<=0)return;
  const ap=E.out(seg(t,-.35,.3));
  ctx.save();ctx.globalAlpha=A*ap;ctx.translate(0,(1-ap)*30);
  rr(MAP.x,MAP.y,MAP.w,MAP.h,44);ctx.fillStyle='#0b1222';ctx.fill();ctx.save();ctx.clip();
  ctx.strokeStyle='rgba(60,120,220,.35)';ctx.lineWidth=70;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(MAP.x-40,MAP.y+300);ctx.bezierCurveTo(400,700,600,1150,MAP.x+MAP.w+40,1080);ctx.stroke();
  for(const r of ROADS){ctx.strokeStyle=r.w>4?'rgba(150,170,210,.26)':'rgba(150,170,210,.12)';ctx.lineWidth=r.w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
    r.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();}
  // 축척 5 km
  ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(860,1362);ctx.lineTo(860+5*KMPX,1362);ctx.moveTo(860,1354);ctx.lineTo(860,1370);ctx.moveTo(860+5*KMPX,1354);ctx.lineTo(860+5*KMPX,1370);ctx.stroke();
  txt('5 km',860+2.5*KMPX,1346,22,700,'#c7c7cc','center',1,0);
  const dayP=E.io(seg(t,.5,3.5)),e=11.54*dayP,R=R0+e*KMPX;   // 오차는 경과 시간에 정비례
  // 실제 거리(파랑)와 시계 오차로 계산된 거리(빨강)
  ctx.strokeStyle='rgba(90,200,250,.5)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(SAT[0],SAT[1],R0,TH-.42,TH+.42);ctx.stroke();
  ctx.setLineDash([12,10]);ctx.strokeStyle='rgba(90,200,250,.75)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(SAT[0],SAT[1]);ctx.lineTo(PH[0],PH[1]);ctx.stroke();ctx.setLineDash([]);
  for(let k=0;k<3;k++){const q=((t*.9)+k/3)%1;ctx.fillStyle=`rgba(255,241,168,${(.9*(1-q*.6)).toFixed(3)})`;ctx.beginPath();ctx.arc(lerp(SAT[0],PH[0],q),lerp(SAT[1],PH[1],q),5,0,6.283);ctx.fill();}
  if(e>.05){ctx.strokeStyle='rgba(255,90,79,.9)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(SAT[0],SAT[1],R,TH-.36,TH+.36);ctx.stroke();
    const qx=SAT[0]+UX*R,qy=SAT[1]+UY*R;ctx.strokeStyle='rgba(255,90,79,.9)';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(PH[0],PH[1]);ctx.lineTo(qx,qy);ctx.stroke();
    ctx.fillStyle='#ff5a4f';ctx.beginPath();ctx.arc(qx,qy,9,0,6.283);ctx.fill();
    const mx=(PH[0]+qx)/2+UY*70,my=(PH[1]+qy)/2-UX*70;ctx.fillStyle='rgba(24,8,8,.9)';rr(mx-92,my-30,184,56,28);ctx.fill();ctx.strokeStyle='rgba(255,138,128,.7)';ctx.lineWidth=2;ctx.stroke();
    txt('+'+e.toFixed(1)+' km',mx,my+10,30,850,'#ff9d94','center',1,0);}
  drawSat(SAT[0],SAT[1],1.2,1);txt('GPS 위성',SAT[0]+10,SAT[1]-46,26,750,'#c7d6f2','center',1,0);
  const pu=(t*1.2)%1;ctx.strokeStyle=`rgba(90,200,250,${(.8*(1-pu)).toFixed(3)})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(PH[0],PH[1],14+40*pu,0,6.283);ctx.stroke();
  ctx.fillStyle=SR;ctx.beginPath();ctx.arc(PH[0],PH[1],12,0,6.283);ctx.fill();
  txt('내 휴대폰',PH[0]-34,PH[1]+44,28,750,SR,'right',1,0);
  txt('계산된 거리',SAT[0]+UX*(R0+11.54*KMPX)-20,SAT[1]+UY*(R0+11.54*KMPX)+44,26,750,'#ff9d94','right',E.out(seg(t,1.2,1.6)),0);
  ctx.restore();
  ctx.fillStyle='rgba(5,8,16,.78)';rr(MAP.x+24,MAP.y+24,MAP.w-48,118,30);ctx.fill();
  txt('경과 시간',MAP.x+60,MAP.y+70,26,650,SUB,'left',1,0);txt(Math.floor(24*dayP+1e-6)+'시간',MAP.x+60,MAP.y+122,48,850,INK,'left',1,-.03);
  txt('위성까지 거리 오차',MAP.x+MAP.w-60,MAP.y+70,26,650,SUB,'right',1,0);txt(e.toFixed(1)+' km',MAP.x+MAP.w-60,MAP.y+122,48,850,'#ff8a80','right',1,-.03);
  ctx.restore();
  const h1=E.out(seg(t,-.3,.25)),h2=E.out(seg(t,.25,.75));
  ctx.save();ctx.shadowColor='rgba(0,0,0,.9)';ctx.shadowBlur=24;
  rich([['상대성 이론을 빼면 GPS는',62,800,INK]],80,352+(1-h1)*28,h1*A,'left');
  rich([['위성 거리를 하루 ',58,800,INK],['11km',62,850,'#ff8a80'],['씩 잘못 잽니다',58,800,INK]],80,436+(1-h2)*28,h2*A,'left');ctx.restore();
  const wa=io(t,3.55,4.4,.3,.25);if(wa>0){ctx.save();ctx.shadowColor='rgba(0,0,0,.95)';ctx.shadowBlur=30;ctx.translate(540,1540);const sc=lerp(.85,1,E.back(seg(t,3.55,3.95)));ctx.scale(sc,sc);txt('왜 그럴까요?',0,0,66,850,INK,'center',wa,-.03);ctx.restore();}
}
/* ---------- 1. 두 이론 소개 ---------- */
function title(t){
  if(t<S.title-.1||t>S.c+.2)return;
  const out=1-E.in(seg(t,7.65,8.05));
  head(t,S.title+.05,7.75,[['시간은 누구에게나',64,800,INK]],[['똑같이 흐르지 ',64,800,INK],['않습니다',66,850,GOLD]]);
  const a1=E.out(seg(t,5.0,5.55))*out,a2=E.out(seg(t,5.6,6.15))*out;
  theoryCard(80,580,920,330,SR,iconLightClock,'1905년','특수 상대성 이론','움직이는 시계는 → 느리게 간다',a1,-(1-a1)*120,t);
  theoryCard(80,950,920,330,GR,iconWell,'1915년','일반 상대성 이론','무거운 천체 가까이선 → 시계가 느려진다',a2,(1-a2)*120,t);
  caption(t,6.4,7.7,[['아인슈타인의 두 이론, ',46,700,INK],['60초',48,850,GOLD],['에 정리합니다',46,700,INK]]);
}
/* =========================================================
   2. 빛의 속도는 누가 재도 같다 (8–13초)
   ========================================================= */
function drawShip(x,y,t){
  ctx.save();ctx.translate(x,y);
  const fl=1+.18*Math.sin(t*40)+.1*Math.sin(t*63);ctx.fillStyle='rgba(255,150,60,.85)';ctx.beginPath();ctx.moveTo(-118,-18);ctx.lineTo(-118-80*fl,0);ctx.lineTo(-118,18);ctx.fill();
  ctx.fillStyle='rgba(255,230,160,.9)';ctx.beginPath();ctx.moveTo(-118,-9);ctx.lineTo(-118-40*fl,0);ctx.lineTo(-118,9);ctx.fill();
  const g=ctx.createLinearGradient(0,-40,0,40);g.addColorStop(0,'#e8eef8');g.addColorStop(1,'#8a97ad');ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(-120,-34);ctx.lineTo(70,-34);ctx.quadraticCurveTo(130,-30,150,0);ctx.quadraticCurveTo(130,30,70,34);ctx.lineTo(-120,34);ctx.closePath();ctx.fill();
  ctx.fillStyle='#5a6880';ctx.beginPath();ctx.moveTo(-100,-34);ctx.lineTo(-130,-70);ctx.lineTo(-70,-34);ctx.fill();ctx.beginPath();ctx.moveTo(-100,34);ctx.lineTo(-130,70);ctx.lineTo(-70,34);ctx.fill();
  ctx.fillStyle='#1d2b44';ctx.beginPath();ctx.arc(60,-4,15,0,6.283);ctx.fill();ctx.fillStyle='rgba(90,200,250,.8)';ctx.beginPath();ctx.arc(60,-4,11,0,6.283);ctx.fill();
  ctx.restore();
}
const shipX=t=>-160+210*(t-8),SHIPY=700,FIRE=9.0,BEAM0=shipX(FIRE)+150;
function cScene(t){
  if(t<7.9||t>13.3)return;const A=io(t,8.0,12.85,.4,.35);
  head(t,8.05,12.8,[['빛의 속도는',66,800,INK]],[['누가 재도 ',66,800,INK],['같습니다',68,850,SR]]);
  ctx.save();ctx.globalAlpha=A;
  // 지면과 관찰자
  ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(60,990);ctx.lineTo(1020,990);ctx.stroke();
  stick(150,990,140,'#cfd6e4',null);txt('지상 관찰자',150,1030,26,700,SUB,'center',1,0);
  // 빛
  if(t>FIRE){const xb=Math.min(1140,BEAM0+420*(t-FIRE));
